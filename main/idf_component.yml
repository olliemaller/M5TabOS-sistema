## IDF Component Manager - equivalent to lib_deps, but for IDF components.
##
## VERSIONS PINNED (==), all of them - including the transitive ones. Any
## change to this file makes the manager recalculate ALL the dependencies,
## and an open range ("^0.2.21", "*") pulls the newest from the registry: changing only
## the TinyUSB version brought along a new M5Unified without anyone asking.
## Updating a component is a deliberate decision: change its version here,
## delete build/esp-idf/<component> (or idf.py fullclean) and test ON THE TAB5.
## The incremental build reuses objects from the previous version: M5Unified
## 0.2.25 "worked" like that, with 0.2.21 code underneath; built clean
## it hangs at boot (M5.getIOExpander(0) empty in tab5_power_camera).
dependencies:
  idf:
    version: ">=5.5"
  m5stack/m5unified:
    version: "==0.2.21"
  ## m5gfx comes via M5Unified (which asks for ">=0.2.28"); pinned here.
  m5stack/m5gfx:
    version: "==0.2.32"
  ## WiFi. The P4 has no radio on chip: IDF's esp_wifi only provides the
  ## headers, and the real implementation comes from here - which in turn pulls in
  ## esp_hosted, the SDIO transport to the ESP32-C6 next to it.
  espressif/esp_wifi_remote:
    version: "==1.6.4"
  ## The transport to the C6 and the bridge behind esp_wifi_remote - pinned
  ## together: the C6 firmware must speak the same esp_hosted version.
  espressif/esp_hosted:
    version: "==3.0.10"
  espressif/esp_serial_slave_link:
    version: "==1.1.2"
  espressif/eppp_link:
    version: "==1.1.6"
  espressif/wifi_remote_over_eppp:
    version: "==0.3.3"
  ## CAMERA. The Tab5's sensor (SC2356/SC202CS) speaks MIPI-CSI, not
  ## the old DVP of the classic esp32-camera - which is why the right pair is this one, the
  ## new Espressif subsystem (V4L2-like: open()/ioctl()/mmap() on
  ## /dev/videoN) on top of the sensor driver. esp_cam_sensor provides the
  ## SC2356 driver itself (Kconfig CONFIG_CAMERA_SC202CS, enabled in
  ## sdkconfig); esp_video provides the pipeline (CSI + ISP) and /dev/videoN.
  espressif/esp_cam_sensor:
    version: "==2.0.1"
  espressif/esp_video:
    version: "==2.0.1"
  ## Transitive, from camera/video.
  espressif/esp_sccb_intf:
    version: "==0.0.9"
  espressif/esp_ipa:
    version: "==1.3.1"
  espressif/esp_h264:
    version: "==1.0.4"
  espressif/usb_host_uvc:
    version: "==2.4.2"
  espressif/cmake_utilities:
    version: "==0.5.3"
  ## FLASH-DRIVE MODE (services/tab5_pendrive). Raw TinyUSB, without
  ## esp_tinyusb on top: esp_tinyusb sets up the PHY the standard way, and the
  ## Tab5's USB-C needs the full-speed PHY SWAPPED with the console's (see
  ## tab5_pendrive.hpp). The configuration is main/tusb_config.h.
  ## 0.21 and not 0.19: 0.19's DWC2 driver, in DMA mode, only keeps ONE
  ## SETUP packet on EP0 (0.21 keeps three and rewrote that path), handles the
  ## OUT interrupts before the IN ones, and MSC re-arms the next
  ## command even with the OUT endpoint stalled. (The symptom that prompted the
  ## change - the computer "stopping" after INQUIRY - was something else: the
  ## speaker beep switching off the OTG pad, see sistema_som_ceder_pinos. 0.21
  ## stayed: tested reading and writing tens of MB, hash checked.)
  espressif/tinyusb:
    version: "~0.21.0"
  ## FLASH DRIVE ON USB-A (services/tab5_usb). The high-speed controller,
  ## with the USB Host Library that already comes with IDF 5.5 (Espressif's TinyUSB does not
  ## do host). This is only the class driver (BOT/SCSI) + FAT at /usb.
  espressif/usb_host_msc:
    version: "==1.3.0"
